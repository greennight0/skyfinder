kind = "mobile"
previewPath = "/"
title = "SkyFinder"
version = "1.0.0"
id = "artifacts/skyfinder"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25735

[services.development]
run = "pnpm --filter @workspace/skyfinder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/skyfinder", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/skyfinder", "run", "serve" ]

[services.env]
PORT = "25735"
BASE_PATH = "/"
